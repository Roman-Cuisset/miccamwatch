# Vendored libspa-sys 0.8.0; provenance and local change are in root Cargo.toml.
[package]
edition = "2021"
name = "libspa-sys"
version = "0.8.0"
authors = [
    "Tom Wagner <tom.a.wagner@protonmail.com",
    "Guillaume Desmottes <guillaume.desmottes@collabora.com>",
]
links = "libspa-0.2"
description = "Rust FFI bindings for libspa"
homepage = "https://pipewire.org"
documentation = "https://pipewire.pages.freedesktop.org/pipewire-rs/libspa_sys/"
readme = false
keywords = [
    "ffi",
    "pipewire",
    "multimedia",
    "audio",
    "video",
]
categories = [
    "api-bindings",
    "multimedia",
]
license = "MIT"
repository = "https://gitlab.freedesktop.org/pipewire/pipewire-rs"

[package.metadata.system-deps.libpipewire]
name = "libpipewire-0.3"
version = "0.3"

[package.metadata.system-deps.libspa]
name = "libspa-0.2"
version = "0.2"

[lib]
doctest = false

[dependencies]

[build-dependencies.bindgen]
version = "=0.72.1"
features = ["runtime"]
default-features = false

[build-dependencies.cc]
version = "1.0"

[build-dependencies.system-deps]
version = "6"

[features]
v0_3_65 = []
