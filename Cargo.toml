[package]
name = "miccamwatch"
version = "0.15.1"
edition = "2024"
rust-version = "1.89"
description = "Monitor microphone and camera access from the command line"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Roman-Cuisset/miccamwatch"

[[bin]]
name = "mcw"
path = "src/main.rs"

[[bin]]
name = "mcw-tray"
path = "src/bin/mcw-tray.rs"
required-features = ["windows-tray"]

[features]
default = []
windows-tray = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"
colored = "3.1.1"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
ctrlc = "3.4"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = "3.4"
libc = "0.2"
pipewire = { version = "=0.8.0", default-features = false, features = ["v0_3_45"] }
ksni = { version = "0.3.6", features = ["blocking"] }
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(windows)'.dependencies]
ctrlc = "3.4"
parking_lot = "0.12"
tempfile = "3.27"
sha2 = "0.11"
self_update = { version = "1.3", default-features = false, features = [
    "archive-zip",
    "checksums",
    "compression-zip-deflate",
    "github",
    "progress-bar",
    "reqwest",
    "rustls",
] }
winreg = "0.55"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Registry",
    "Win32_System_EventLog",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
zip = { version = "8", default-features = false }

[patch.crates-io]
# Exact libspa 0.8.0 published source (MIT), upstream commit
# 449bf53f5d5edc8d0be6c0c80bc19d882f712dd7; crate SHA-256:
# 65f3a4b81b2a2d8c7f300643676202debd1b7c929dbf5c9bb89402ea11d19810.
# Local review scope: gate the unused VideoInfoRaw wrapper/imports/impls at v0_3_65
# (the header layout's introduction), preserving stock Ubuntu 22.04 PipeWire 0.3.48.
# Revisit this patch against upstream when upgrading bindings; no ABI substitution.
libspa = { path = "vendor/libspa" }
