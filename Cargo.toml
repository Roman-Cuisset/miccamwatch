[package]
name = "miccamwatch"
version = "0.13.2"
edition = "2024"
description = "Monitor Windows microphone and camera access from the command line"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Roman-Cuisset/miccamwatch"

[[bin]]
name = "mcw"
path = "src/main.rs"

[[bin]]
name = "mcw-tray"
path = "src/bin/mcw-tray.rs"

[dependencies]
base64 = "0.22"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"
ratatui = "0.30"
crossterm = "0.29"
self_update = { version = "1.3", default-features = false, features = [
    "archive-zip",
    "checksums",
    "compression-zip-deflate",
    "github",
    "progress-bar",
    "reqwest",
    "rustls",
] }
winreg = "0.55"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Registry",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
colored = "3.1.1"
