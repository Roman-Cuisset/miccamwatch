name: Public Windows update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public stable release to install
        required: true
        type: string
      source-digest:
        description: Qualified full source commit for that release
        required: true
        type: string
      upgrade-from:
        description: Older public stable release
        required: true
        type: string
      upgrade-source-digest:
        description: Full source commit for the older release
        required: true
        type: string
      active-tray:
        description: Start genuine old trays in disposable hosted scope (including captured-stream EOF qualification)
        required: true
        default: false
        type: boolean
      current-repair-only:
        description: Qualify current CLI repair of an active verified older tray and successor no-op; skip legacy-client upgrade
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  attestations: read

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE: ${{ inputs.source-digest }}
      UPGRADE_FROM: ${{ inputs.upgrade-from }}
      UPGRADE_SOURCE: ${{ inputs.upgrade-source-digest }}
      ACTIVE_TRAY: ${{ inputs.active-tray }}
      CURRENT_REPAIR_ONLY: ${{ inputs.current-repair-only }}
    steps:
      - name: Check out qualification fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify public payloads and exercise update no-op and paired repair
        shell: pwsh
        run: |
          & ./installer/tests/windows-public-update.ps1 -ActiveTray:($env:ACTIVE_TRAY -eq 'true') -CurrentRepairOnly:($env:CURRENT_REPAIR_ONLY -eq 'true')
      - name: Upload public migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-windows-update-proof
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/public-update-proof/**/*.txt
            ${{ runner.temp }}/public-update-proof/**/*.json
            ${{ runner.temp }}/public-update-proof/**/*.toml
            ${{ runner.temp }}/public-update-proof/**/SHA256SUMS
