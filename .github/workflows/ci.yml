name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      native-only:
        type: boolean
        default: false
      release-packages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    if: ${{ !inputs.native-only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features windows-tray --locked -- -D warnings
      - run: cargo test --all-targets --features windows-tray --locked
      - name: Audit Rust dependencies
        run: cargo install cargo-audit --locked && cargo audit
      - run: cargo build --release --locked --features windows-tray
      - name: Build and smoke-test per-user MSI
        shell: pwsh
        run: |
          dotnet tool restore
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          dotnet wix build installer/miccamwatch.wxs -d Version=$version -d Executable=target/release/mcw.exe -d TrayExecutable=target/release/mcw-tray.exe -o target/miccamwatch-windows-x86_64.msi
          $msi = (Resolve-Path target/miccamwatch-windows-x86_64.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with code $($install.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\MicCamWatch\mcw.exe'
          $installedTray = Join-Path $env:LOCALAPPDATA 'Programs\MicCamWatch\mcw-tray.exe'
          if (-not (Test-Path $installed)) { throw "Installed CLI executable is missing" }
          if (-not (Test-Path $installedTray)) { throw "Installed tray executable is missing" }
          $reported = & $installed --version
          if ($reported -ne "mcw $version") { throw "Installed version mismatch: $reported" }
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with code $($uninstall.ExitCode)" }

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Install ephemeral Linux native and desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libspa-0.2-dev libclang-dev pipewire pipewire-bin gnupg dbus-x11 xvfb openbox xfce4-panel xfconf xfce4-notifyd libnotify-bin x11-utils xdotool imagemagick pulseaudio gnome-session-canberra libcanberra-pulse sound-theme-freedesktop zsh fish strace
          # The hosted image's shared-directory ownership is not a secure
          # administrator-helper prerequisite. Repair only this disposable VM;
          # production installers retain their fail-closed ancestry checks.
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -d /usr/share && test ! -L /usr/share
          stat -c '/usr/share before root-helper prerequisites: uid=%u gid=%g mode=%a' /usr/share
          sudo chown root:root /usr/share
          sudo chmod go-w /usr/share
          stat -c '/usr/share after root-helper prerequisites: uid=%u gid=%g mode=%a' /usr/share
          pkg-config --modversion libpipewire-0.3
          pw-dump --version
      - name: Verify native architecture and minimum macOS version
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_PACKAGES: ${{ inputs.release-packages }}
        run: |
          actual=$(uname -m)
          case "$actual" in arm64) actual=aarch64 ;; esac
          test "$actual" = "$EXPECTED_ARCH"
          if [ "$RUNNER_OS" = macOS ]; then
            version=$(sw_vers -productVersion)
            echo "macOS runtime: $version"
            echo "macOS SDK: $(xcrun --show-sdk-version)"
            swiftc --version
            test "${version%%.*}" -ge 15
          fi
          python3 -c 'import json, os, subprocess; v=json.loads(subprocess.check_output(["cargo","metadata","--no-deps","--format-version","1"]))["packages"][0]["version"]; assert os.environ["RELEASE_PACKAGES"] != "true" or os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] == "v" + v'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked ${{ matrix.platform == 'linux' && '--features linux-camera-helper' || '' }} -- -D warnings
      - run: cargo test --all-targets --locked ${{ matrix.platform == 'linux' && '--features linux-camera-helper' || '' }}
      - run: cargo build --locked ${{ matrix.platform == 'linux' && '--features linux-camera-helper' || '' }}
      - run: cargo build --release --locked ${{ matrix.platform == 'linux' && '--features linux-camera-helper' || '' }}
      - name: Extract package and prepare disposable native smoke
        shell: bash
        env:
          PACKAGE: miccamwatch-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            tar -czf "$PACKAGE" -C target/release mcw mcw-camera-helper -C "$GITHUB_WORKSPACE/installer" install-camera-helper.sh com.roman-cuisset.miccamwatch.camera.policy -C "$GITHUB_WORKSPACE" README.md LICENSE
          else
            tar -czf "$PACKAGE" -C target/release mcw -C "$GITHUB_WORKSPACE" README.md LICENSE
          fi
          mkdir -p "$RUNNER_TEMP/native-proof/package"
          tar -xzf "$PACKAGE" -C "$RUNNER_TEMP/native-proof/package"
          echo "MCW_RELEASE_BINARY=$RUNNER_TEMP/native-proof/package/mcw" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "native-chime.rs"
          source.write_text('fn main() { match miccamwatch::platform::play_chime() { Ok(()) => println!("native playback accepted"), Err(error) => { eprintln!("{error:#}"); std::process::exit(2); } } }\n')
          library = pathlib.Path("target/debug/libmiccamwatch.rlib")
          assert library.is_file(), library
          try:
              subprocess.run(["rustc", "--edition=2024", "--crate-name=mcw_native_chime", str(source),
                              "--extern", "miccamwatch=" + str(library), "-L", "dependency=target/debug/deps",
                              "-o", str(root / "native-chime")], check=True)
          finally:
              source.unlink()
          PY
          cat > "$RUNNER_TEMP/native-smoke.py" <<'PY'
          import errno, fcntl, json, os, pathlib, pty, re, select, shutil, signal, struct, subprocess, tempfile, termios, time
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-proof"
          binary = os.environ["MCW_RELEASE_BINARY"]
          linux = os.environ["RUNNER_OS"] == "Linux"
          version = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))["packages"][0]["version"]
          login_environment = os.environ.copy()
          home = pathlib.Path(tempfile.mkdtemp(prefix="mcw-", dir="/tmp")).resolve()
          # Isolate state; only owned fixture services/registrations are changed.
          os.environ.update(HOME=str(home), XDG_CONFIG_HOME=str(home / "config"), XDG_DATA_HOME=str(home / "data"),
                            XDG_STATE_HOME=str(home / "state"), XDG_RUNTIME_DIR=str(home / "run"), TERM="xterm-256color")
          (home / "run").mkdir(mode=0o700)
          if linux:
              os.environ.update(PIPEWIRE_RUNTIME_DIR=str(home / "run"), PIPEWIRE_REMOTE="pipewire-0")
          children = []
          handles = []
          def record(name, args, allowed=(0,), timeout=45, env=None):
              result = subprocess.run(args, capture_output=True, timeout=timeout, env=env)
              (proof / (name + ".stdout")).write_bytes(result.stdout)
              (proof / (name + ".stderr")).write_bytes(result.stderr)
              (proof / (name + ".exit")).write_text(str(result.returncode))
              assert result.returncode in allowed, (name, result.returncode, result.stderr.decode(errors="replace"))
              return result
          def launch(name, args):
              handle = (proof / (name + ".log")).open("wb")
              errors = (proof / (name + ".stderr")).open("wb")
              handles.extend((handle, errors))
              process = subprocess.Popen(args, stdout=handle, stderr=errors, start_new_session=True)
              children.append(process)
              return process
          def stop(process, sig=signal.SIGTERM):
              if process.poll() is None:
                  os.killpg(process.pid, sig)
                  process.wait(timeout=20)
          def until(fn, description, seconds=30):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  if fn():
                      return
                  time.sleep(.25)
              raise AssertionError(description)
          def status(name):
              result = record(name, [binary, "status", "--json"], (0, 1, 2))
              document = json.loads(result.stdout)
              assert document["collectors"], document
              assert all(row["state"] in ("healthy", "degraded", "unavailable") for row in document["collectors"])
              assert all(row.get("detail") for row in document["collectors"] if row["state"] != "healthy")
              return document
          def tui(name, cancel=False):
              master, slave = pty.openpty()
              fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack("HHHH", 40, 140, 0, 0))
              def controlling_terminal():
                  os.setsid()
                  fcntl.ioctl(0, termios.TIOCSCTTY, 0)
              process = subprocess.Popen([binary, "--lang", "en", "top"], stdin=slave, stdout=slave, stderr=slave,
                                         preexec_fn=controlling_terminal, close_fds=True)
              os.close(slave)
              output = bytearray()
              def drain(seconds):
                  deadline = time.monotonic() + seconds
                  while time.monotonic() < deadline:
                      if select.select([master], [], [], .1)[0]:
                          try:
                              chunk = os.read(master, 65536)
                          except OSError as error:
                              if error.errno == errno.EIO:
                                  return
                              raise
                          if not chunk:
                              return
                          output.extend(chunk)
              try:
                  drain(6)
                  assert process.poll() is None, "TUI exited before keyboard input"
                  os.write(master, b"R")
                  drain(2)
                  if cancel:
                      os.write(master, b"\x1b[B")  # Select the actual owned capture row.
                      drain(.5)
                      os.write(master, b"K")  # Never send a second K: no termination is authorized.
                      drain(.5)
                      os.write(master, b"\x1b")
                      drain(.5)
                      assert process.poll() is None, "Cancel incorrectly quit the TUI"
                  os.write(master, b"Q")
                  drain(2)
                  assert process.wait(timeout=15) == 0
              finally:
                  if process.poll() is None:
                      stop(process, signal.SIGINT)
                  os.close(master)
                  (proof / (name + ".ansi")).write_bytes(output)
                  text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output.decode(errors="replace"))
                  (proof / (name + ".txt")).write_text(text)
          try:
              assert record("version", [binary, "--version"]).stdout.decode().strip() == "mcw " + version
              for language in ("en", "fr", "de", "es", "ja", "zh", "ru"):
                  record("help-" + language, [binary, "--lang", language, "--help"])
                  record("camera-help-" + language, [binary, "--lang", language, "help", "camera"])
                  for command in ("camera", "autostart", "lock-policy"):
                      record(command + "-direct-help-" + language, [binary, "--lang", language, command, "--help"])
              if linux:
                  helper = pathlib.Path(binary).with_name("mcw-camera-helper")
                  protocol = json.loads(record("camera-helper-protocol", [str(helper), "--protocol-version"]).stdout)
                  assert protocol == {"protocol": 1, "version": version}, protocol
                  # Packaging pairs the helper, but does not authorize/install it or mutate devices.
                  for asset in ("install-camera-helper.sh", "com.roman-cuisset.miccamwatch.camera.policy"):
                      assert pathlib.Path(binary).with_name(asset).is_file(), asset
                  record("display", ["xdpyinfo"])
                  # dbus-run-session starts before Xvfb/Python set the disposable
                  # desktop environment. Update only this private bus, not systemd.
                  record("desktop-activation-environment", ["dbus-update-activation-environment",
                         "DISPLAY", "XAUTHORITY", "HOME", "XDG_CONFIG_HOME", "XDG_DATA_HOME",
                         "XDG_STATE_HOME", "XDG_RUNTIME_DIR"])
                  launch("window-manager", ["openbox"])
                  # Configure the real XFCE panel's built-in StatusNotifier-capable tray.
                  for args in (
                      ["-p", "/configver", "-n", "-t", "int", "-s", "2"],
                      ["-p", "/panels", "-n", "-a", "-t", "int", "-s", "1"],
                      ["-p", "/panels/panel-1/position", "-n", "-t", "string", "-s", "p=6;x=640;y=20"],
                      ["-p", "/panels/panel-1/length", "-n", "-t", "uint", "-s", "100"],
                      ["-p", "/panels/panel-1/plugin-ids", "-n", "-a", "-t", "int", "-s", "1"],
                      ["-p", "/plugins/plugin-1", "-n", "-t", "string", "-s", "systray"],
                  ):
                      record("panel-config-" + str(len(handles)) + args[1].replace("/", "-"),
                             ["xfconf-query", "-c", "xfce4-panel", *args])
                  launch("panel", ["xfce4-panel", "--disable-wm-check"])
                  host = ["gdbus", "call", "--session", "--dest", "org.kde.StatusNotifierWatcher",
                          "--object-path", "/StatusNotifierWatcher", "--method", "org.freedesktop.DBus.Properties.Get",
                          "org.kde.StatusNotifierWatcher", "IsStatusNotifierHostRegistered"]
                  until(lambda: b"true" in subprocess.run(host, capture_output=True).stdout,
                        "Real XFCE StatusNotifier host was not registered")
                  record("status-notifier-host", host)
                  record("notification-daemon", ["notify-send", "--expire-time=10000", "Native smoke session",
                                                 "Real desktop host; no physical capture or hardware mutation is tested"])
                  record("notification-owner", ["gdbus", "call", "--session", "--dest", "org.freedesktop.DBus",
                         "--object-path", "/org/freedesktop/DBus", "--method", "org.freedesktop.DBus.GetNameOwner",
                         "org.freedesktop.Notifications"])
                  # PipeWire alone does not discover ALSA/V4L2 devices. Deliberately do not run a hardware session manager.
                  pipewire = launch("pipewire", ["pipewire"])
                  until(lambda: (home / "run/pipewire-0").exists(), "Isolated PipeWire socket not ready")
                  record("pipewire-graph", ["pw-dump"])
              else:
                  gui = record("aqua-session", ["launchctl", "print", "gui/" + str(os.getuid())], tuple(range(256)))
                  (proof / "macos-prerequisites.txt").write_text(
                      "Menu bar needs this user's Aqua/WindowServer session. Screenshot needs Screen Recording approval "
                      "for the runner process; notifications need native authorization. No TCC edits, permission requests, "
                      "camera profiles or writable-input mute mutations are performed. Public macOS lock state remains Unknown.\n")
              current = status("status")
              doctor = record("doctor", [binary, "doctor", "--json"], (0, 2))
              checks = json.loads(doctor.stdout)
              assert checks and all(row["status"] in ("ok", "warning", "error") and row.get("detail") for row in checks)
              devices = record("devices", [binary, "devices", "--json"], (0, 2))
              if devices.returncode == 0:
                  json.loads(devices.stdout)
              record("camera-query", [binary, "camera", "status"], (0, 2))
              record("mute-query", [binary, "mute", "--status"], (0, 2))
              record("autostart-query", [binary, "autostart", "status"], (0, 1, 2))
              record("notifications-query", [binary, "notifications", "status"], (0, 2))
              record("lock-query", [binary, "lock-policy", "status"], (0, 2))
              if linux:
                  assert any(row["state"] == "healthy" for row in current["collectors"]), current
                  record("virtual-source", ["pw-cli", "create-node", "adapter",
                         "{ factory.name=support.null-audio-sink node.name=MCW_CI_Source media.class=Audio/Source object.linger=true audio.position=[MONO] }"])
                  # PipeWire 0.3.48 accepts only numeric targets and has no
                  # --properties option. Manual linking needs no target hint.
                  capture = launch("virtual-capture", ["pw-cat", "--record", "--rate=48000", "--channels=1",
                                   "--format=s16", "--target=0", "/dev/null"])
                  def virtual_node(name):
                      graph = json.loads(subprocess.check_output(["pw-dump"]))
                      return next((row for row in graph
                                   if row.get("info", {}).get("props", {}).get("node.name") == name), None)
                  def virtual_capture():
                      graph = json.loads(subprocess.check_output(["pw-dump"]))
                      clients = {str(row["id"]) for row in graph if row.get("type") == "PipeWire:Interface:Client"
                                 and str(row.get("info", {}).get("props", {}).get("application.process.id")) == str(capture.pid)}
                      return next((row for row in graph if
                                   str(row.get("info", {}).get("props", {}).get("client.id")) in clients
                                   and row.get("info", {}).get("props", {}).get("media.class") == "Stream/Input/Audio"), None)
                  until(lambda: virtual_capture() is not None, "Owned virtual capture node was not exported")
                  # Without a hardware session manager both adapters need explicit
                  # native port configuration. The null sink's monitor is our source.
                  for node, monitor in ((virtual_node("MCW_CI_Source"), "true"), (virtual_capture(), "false")):
                      record("virtual-port-config-" + str(node["id"]), ["pw-cli", "set-param", str(node["id"]),
                             "PortConfig", "{ direction=Input mode=dsp monitor=" + monitor
                             + " format={ mediaType=audio mediaSubtype=raw format=F32P rate=48000 channels=1 position=[MONO] } }"])
                  def link_virtual():
                      outputs = subprocess.check_output(["pw-link", "-o"], text=True).splitlines()
                      inputs = subprocess.check_output(["pw-link", "-i"], text=True).splitlines()
                      source = next((p.strip() for p in outputs if "MCW_CI_Source:" in p), None)
                      sink = next((p.strip() for p in inputs if p.strip().startswith(
                                  virtual_capture()["info"]["props"]["node.name"] + ":")), None)
                      return bool(source and sink and subprocess.run(["pw-link", source, sink], capture_output=True).returncode == 0)
                  until(link_virtual, "Virtual PipeWire source/record ports were not available")
                  until(lambda: any(a.get("pid") == capture.pid and a.get("activity") == "active"
                                    for a in status("virtual-status")["accesses"]), "Native virtual capture PID not observed")
                  record("virtual-active-graph", ["pw-dump"])
                  def virtual_source():
                      return virtual_node("MCW_CI_Source")
                  def virtual_muted():
                      return any(parameter.get("mute") is True
                                 for parameter in virtual_source()["info"]["params"].get("Props", []))
                  assert not virtual_muted(), "Owned virtual source did not start unmuted"
                  def virtual_control(name, command):
                      try:
                          record(name, [binary, command])
                      finally:
                          # Keep independent graph evidence even if native control fails.
                          record(name + "-readback", ["pw-dump"])
                  virtual_control("virtual-mute", "mute")
                  until(virtual_muted, "Native mute did not change the owned virtual source")
                  virtual_control("virtual-unmute", "unmute")
                  until(lambda: not virtual_muted(), "Owned restoration did not restore the virtual source")
                  source_id = str(virtual_source()["id"])
                  record("virtual-premute", ["pw-cli", "set-param", source_id, "Props", "{ mute=true }"])
                  until(virtual_muted, "Fixture pre-mute did not reach the virtual source")
                  virtual_control("virtual-premuted-mute", "mute")
                  virtual_control("virtual-premuted-restore", "unmute")
                  assert virtual_muted(), "Owned restoration incorrectly unmuted a previously muted source"
                  record("virtual-reset", ["pw-cli", "set-param", source_id, "Props", "{ mute=false }"])
                  until(lambda: not virtual_muted(), "Virtual source fixture cleanup did not restore its own state")
                  tui("tui-uppercase-cancel-quit", cancel=True)
                  assert capture.poll() is None, "Cancelled TUI action terminated virtual capture"
                  pulse_socket = home / "run/pulse-native"
                  os.environ.update(PULSE_SERVER="unix:" + str(pulse_socket), CANBERRA_DRIVER="pulse")
                  launch("virtual-sound-server", ["pulseaudio", "--daemonize=no", "--exit-idle-time=-1",
                         "--use-pid-file=no", "--disable-shm=yes", "-n",
                         "--load=module-native-protocol-unix socket=" + str(pulse_socket),
                         "--load=module-null-sink sink_name=MCW_CI_Sound"])
                  until(pulse_socket.exists, "Owned virtual sound server did not start")
                  record("native-pulse-info", ["pactl", "info"])
                  record("native-chime", [str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-chime")])
              else:
                  tui("tui-uppercase-quit")
                  (proof / "tui-cancel-prerequisite.txt").write_text(
                      "Esc cancellation is exercised on Linux's isolated, identified virtual capture process. "
                      "macOS runner has no authorized disposable CoreAudio capture client; no hardware capture is opened to manufacture one.\n")
                  chime = record("native-chime", [str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-chime")], (0, 2))
                  if chime.returncode == 2:
                      (proof / "sound-prerequisite.txt").write_text(
                          "Native NSSound rejected playback on this runner; actual native error is retained. "
                          "No physical speaker/output-device behavior is asserted.\n")
              if linux:
                  launch("notification-native-traffic", ["dbus-monitor", "--session",
                         "type='method_call',interface='org.freedesktop.Notifications',member='Notify'"])
                  time.sleep(.5)
              watch = launch("watch", [binary, "--lang", "en", "watch", "--json", "--interval", "200",
                             *(["--notify", "--eventlog"] if linux else [])])
              time.sleep(5)
              assert watch.poll() is None
              if linux:
                  traffic = (proof / "notification-native-traffic.log").read_text(errors="replace")
                  assert "member=Notify" in traffic, "Real mcw notification was not delivered to the native daemon"
                  journal = record("native-journal", ["sudo", "journalctl", "--no-pager", "--output=json",
                                   "_PID=" + str(watch.pid), "SYSLOG_IDENTIFIER=miccamwatch"])
                  journal_events = [json.loads(line) for line in journal.stdout.splitlines()]
                  assert any(json.loads(row["MESSAGE"]).get("event_code") == 1001 for row in journal_events), (
                      "Native mcw START event was not accepted by the system journal", journal.stdout)
                  record("native-notification-screenshot", ["import", "-window", "root", str(proof / "notification.png")])
                  before = (proof / "watch.log").stat().st_size
                  stop(pipewire)
                  # Preserve live-watch continuity across a real session-service outage.
                  time.sleep(5)
                  unavailable = status("status-outage")
                  assert all(row["state"] == "unavailable" for row in unavailable["collectors"]), unavailable
                  outage_doctor = json.loads(record("doctor-outage", [binary, "doctor", "--json"], (2,)).stdout)
                  assert any(row["status"] == "error" for row in outage_doctor)
                  outage = (proof / "watch.log").read_bytes()[before:]
                  (proof / "watch-outage.jsonl").write_bytes(outage)
                  records = [json.loads(line) for line in outage.splitlines()]
                  assert any(row.get("collectors") for row in records), "Watch did not report service outage coverage"
                  # A complete but degraded shutdown scan may report real client departure.
                  # Only the unavailable period is an observation gap.
                  gap = next(i for i, row in enumerate(records) if row.get("collectors") and
                             all(c["state"] == "unavailable" for c in row["collectors"]))
                  assert all(row.get("action") not in ("start", "stop") for row in records[gap + 1:]), outage
              stop(watch, signal.SIGINT)
              assert watch.returncode == 0, watch.returncode
              for line in (proof / "watch.log").read_bytes().splitlines():
                  json.loads(line)
              # Native lifecycle is exercised even if screenshot authorization is absent.
              tray = launch("tray", [binary, "--lang", "en", "tray", "run"])
              ready = False
              deadline = time.monotonic() + 35
              while time.monotonic() < deadline and tray.poll() is None:
                  result = subprocess.run([binary, "tray", "status"], capture_output=True, timeout=15)
                  (proof / "tray-status.stdout").write_bytes(result.stdout)
                  (proof / "tray-status.stderr").write_bytes(result.stderr)
                  if result.returncode == 0:
                      ready = True
                      break
                  time.sleep(.5)
              if not ready and not linux and gui.returncode != 0:
                  (proof / "gui-unavailable.txt").write_text(
                      "Native tray attempted but this runner lacks a launchctl gui/<uid> Aqua session. "
                      "A logged-in graphical macOS 15+ runner is required; see aqua-session and tray native output.\n")
                  print("::warning::macOS native GUI prerequisite missing: logged-in Aqua/WindowServer session")
              else:
                  assert ready, (proof / "tray.stderr").read_text(errors="replace")
                  record("tray-ready", [binary, "tray", "status"])
                  if linux:
                      record("registered-tray-items", ["gdbus", "call", "--session", "--dest", "org.kde.StatusNotifierWatcher",
                             "--object-path", "/StatusNotifierWatcher", "--method", "org.freedesktop.DBus.Properties.Get",
                             "org.kde.StatusNotifierWatcher", "RegisteredStatusNotifierItems"])
                      record("desktop-screenshot", ["import", "-window", "root", str(proof / "desktop.png")])
                      # The disposable panel's one icon is visible at this verified coordinate.
                      record("native-menu-open", ["xdotool", "mousemove", "26", "12", "click", "3"])
                      time.sleep(.5)
                      record("native-menu-screenshot", ["import", "-window", "root", str(proof / "menu.png")])
                      record("native-menu-close", ["xdotool", "key", "Escape"])
                  else:
                      screenshot = record("desktop-screenshot", ["screencapture", "-x", str(proof / "desktop.png")], (0, 1))
                      if screenshot.returncode != 0:
                          (proof / "screenshot-unavailable.txt").write_text(
                              "screencapture could not capture the native display. A visible Aqua desktop and Screen Recording "
                              "authorization for the runner process are required; native stderr is preserved, no TCC changes made.\n")
                          print("::warning::macOS screenshot unavailable; native output retained; inspect Screen Recording/Aqua prerequisites")
                      menu_source = home / "menu-input.swift"
                      menu_input = home / "menu-input"
                      menu_source.write_text("""
          import CoreGraphics
          import Foundation
          import Darwin
          guard CGPreflightPostEventAccess() else { exit(2) }
          let bounds = CGDisplayBounds(CGMainDisplayID())
          // Verified native status-item position on both disposable runner desktops.
          let point = CGPoint(x: bounds.maxX - 231, y: bounds.minY + 12)
          for kind in [CGEventType.rightMouseDown, CGEventType.rightMouseUp] {
              guard let event = CGEvent(mouseEventSource: nil, mouseType: kind,
                                        mouseCursorPosition: point, mouseButton: .right) else { exit(3) }
              event.post(tap: .cghidEventTap)
              Thread.sleep(forTimeInterval: 0.1)
          }
          """)
                      record("native-menu-input-build", ["swiftc", str(menu_source), "-o", str(menu_input)])
                      posted = record("native-menu-open", [str(menu_input)], (0, 2))
                      if posted.returncode == 0:
                          time.sleep(.5)
                          record("native-menu-screenshot", ["screencapture", "-x", str(proof / "menu.png")], (0, 1))
                      else:
                          (proof / "menu-input-prerequisite.txt").write_text(
                              "Public CGPreflightPostEventAccess refused event posting. No input or TCC permission was requested; "
                              "the real status item and owned stop remain exercised, menu-click proof needs an authorized GUI operator.\n")
                  record("tray-stop", [binary, "tray", "stop"])
                  assert tray.wait(timeout=20) == 0, "Native helper did not exit cleanly after owned stop"
                  assert record("tray-stopped", [binary, "tray", "status"], (1,)).stdout.strip() == b"stopped"
                  if linux:
                      record("desktop-after-stop", ["import", "-window", "root", str(proof / "desktop-after-stop.png")])
                  else:
                      record("desktop-after-stop", ["screencapture", "-x", str(proof / "desktop-after-stop.png")], (0, 1))
              if linux:
                  entry = home / "config/autostart/com.roman-cuisset.miccamwatch.desktop"
                  try:
                      record("autostart-enable", [binary, "autostart", "enable"])
                      record("autostart-enabled", [binary, "autostart", "status"])
                      launch("desktop-autostart", ["gio", "launch", str(entry)])
                      until(lambda: subprocess.run([binary, "tray", "status"], capture_output=True).returncode == 0,
                            "The owned desktop entry did not start the native tray")
                      record("autostart-native-tray", [binary, "tray", "status"])
                      record("autostart-native-stop", [binary, "tray", "stop"])
                      until(lambda: subprocess.run([binary, "tray", "status"], capture_output=True).returncode == 1,
                            "The desktop-launched tray did not stop")
                  finally:
                      subprocess.run([binary, "tray", "stop"], capture_output=True, timeout=15)
                      record("autostart-disable", [binary, "autostart", "disable"])
                  assert record("autostart-disabled", [binary, "autostart", "status"], (1,)).stdout.strip() == b"disabled"
                  assert not entry.exists(), "Owned desktop registration remained after disable"
                  unmanaged = b"[Desktop Entry]\nType=Application\nName=Unmanaged fixture\nExec=/bin/true\n"
                  entry.write_bytes(unmanaged)
                  try:
                      record("autostart-unmanaged-enable", [binary, "autostart", "enable"], (1, 2))
                      record("autostart-unmanaged-disable", [binary, "autostart", "disable"], (1, 2))
                      assert entry.read_bytes() == unmanaged, "An unmanaged desktop entry was modified"
                  finally:
                      entry.unlink()
              elif ready:
                  service = "gui/" + str(os.getuid()) + "/com.roman-cuisset.miccamwatch.tray"
                  existing = record("launchagent-before", ["launchctl", "print", service], (3, 113))
                  assert existing.returncode != 0, "An unrelated LaunchAgent must not be replaced"
                  real_state = []
                  for command in (["config", "settings-path"], ["history", "path"]):
                      path = pathlib.Path(record("login-" + command[0] + "-path",
                             [binary, *command], env=login_environment).stdout.decode().strip())
                      assert not path.parent.exists(), "Existing login-session MCW state must remain untouched"
                      real_state.append(path.parent)
                  entry = home / "Library/LaunchAgents/com.roman-cuisset.miccamwatch.tray.plist"
                  try:
                      record("autostart-enable", [binary, "autostart", "enable"])
                      record("autostart-enabled", [binary, "autostart", "status"])
                      record("launchagent-loaded", ["launchctl", "print", service])
                      until(lambda: subprocess.run([binary, "tray", "status"], env=login_environment,
                            capture_output=True, timeout=15).returncode == 0,
                            "The owned native LaunchAgent did not start the menu bar in its login environment")
                      record("autostart-native-tray", [binary, "tray", "status"], env=login_environment)
                  finally:
                      record("autostart-disable", [binary, "autostart", "disable"])
                      subprocess.run([binary, "tray", "stop"], env=login_environment, capture_output=True, timeout=15)
                      for directory in set(real_state):
                          if directory.exists():
                              shutil.rmtree(directory)
                  assert record("autostart-disabled", [binary, "autostart", "status"], (1,)).stdout.strip() == b"disabled"
                  record("launchagent-unloaded", ["launchctl", "print", service], (3, 113))
                  assert not entry.exists(), "Owned LaunchAgent remained after disable"
              (proof / "scope.txt").write_text(
                  "Extracted native package; real CLI, PTY and native tray/control lifecycle. Linux uses real XFCE StatusNotifier "
                  "panel, notification daemon, session D-Bus and isolated PipeWire virtual source; never a mock GUI. "
                  "Screenshots require human review. No physical capture, hardware mute/camera mutation, macOS profile installation, "
                  "notification permission grant, real lock/unlock transition, signing or AV-clearance proof is asserted.\n")
          finally:
              for process in reversed(children):
                  stop(process)
              for handle in handles:
                  handle.close()
              pathlib.Path(os.environ["RUNNER_TEMP"], "native-chime").unlink(missing_ok=True)
              shutil.rmtree(home)
          PY
      - name: Exercise genuine Linux user payload and explicit root boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -B installer/tests/native_camera.py \
            --source-file "$GITHUB_WORKSPACE/installer/install.sh" \
            --archive "$GITHUB_WORKSPACE/miccamwatch-linux-x86_64.tar.gz" \
            --root-installer "$RUNNER_TEMP/native-proof/package/install-camera-helper.sh" \
            --version v0.16.0 \
            --proof "$RUNNER_TEMP/native-proof/linux-camera"
      - name: Record separate read-only macOS system and MCW camera inventories
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, platform, subprocess, tempfile
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-proof/macos-camera"
          proof.mkdir(parents=True, exist_ok=True)
          binary = os.environ["MCW_RELEASE_BINARY"]
          def record(name, args, env=None, codes=(0,)):
              result = subprocess.run(args, env=env, capture_output=True, timeout=120)
              (proof / (name + ".json")).write_bytes(result.stdout)
              (proof / (name + ".stderr")).write_bytes(result.stderr)
              (proof / (name + ".exit")).write_text(str(result.returncode) + "\n")
              assert result.returncode in codes, (name, result.returncode, result.stderr)
              return json.loads(result.stdout)
          (proof / "scope.txt").write_text(
              "Read-only system_profiler SPCameraDataType JSON and separately reported MCW devices/status JSON. "
              "Extracted release MCW executes its actual embedded revised Swift/CoreMediaIO helper. "
              "System camera presence and MCW discovery are independent inventories; empty or differing lists "
              "are not a physical activity-transition test. No capture session, camera/microphone permission "
              "request, media recording, TCC reset, configuration profile or device mutation. Hosted macOS 15 "
              "ARM/Intel cannot prove @godsheep's MacBook Pro Apple Silicon/macOS 27/Telegram START/STOP parity.\n")
          host = dict(os=platform.platform(), arch=platform.machine(),
                      macos=subprocess.check_output(["sw_vers", "-productVersion"], text=True).strip(),
                      sdk=subprocess.check_output(["xcrun", "--show-sdk-version"], text=True).strip(),
                      mcw=subprocess.check_output([binary, "--version"], text=True).strip())
          (proof / "host.json").write_text(json.dumps(host, indent=2) + "\n")
          system = record("system-profiler-cameras", ["/usr/sbin/system_profiler", "SPCameraDataType", "-json"])
          assert isinstance(system.get("SPCameraDataType"), list), system
          with tempfile.TemporaryDirectory(prefix="mcw-macos-inventory-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              home = pathlib.Path(temporary)
              env = dict(os.environ, HOME=str(home), XDG_CONFIG_HOME=str(home / "config"),
                         XDG_STATE_HOME=str(home / "state"), XDG_DATA_HOME=str(home / "data"),
                         TMPDIR=str(home) + "/")
              status = record("mcw-status", [binary, "status", "--json"], env=env, codes=(0, 1, 2))
              devices = record("mcw-devices", [binary, "devices", "--json"], env=env)
              assert isinstance(devices, list), devices
              cameras = [row for row in devices if row["resource"] == "camera"]
              collector = next(row for row in status["collectors"] if row["collector"] == "coremediaio_video")
              summary = dict(system_camera_count=len(system["SPCameraDataType"]), mcw_camera_count=len(cameras),
                             system_cameras_present=bool(system["SPCameraDataType"]),
                             mcw_cameras_present=bool(cameras), camera_collector=collector,
                             physical_activity_transition_proven=False, macos27_friend_hardware_parity_proven=False)
              (proof / "inventory-scope.json").write_text(json.dumps(summary, indent=2) + "\n")
              assert collector["state"] in ("healthy", "degraded"), status
          PY
      - name: Exercise native Linux desktop and extracted package
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" python3 "$RUNNER_TEMP/native-smoke.py"
      - name: Exercise native macOS menu bar and extracted package
        if: runner.os == 'macOS'
        shell: bash
        run: python3 "$RUNNER_TEMP/native-smoke.py"
      - name: Remove temporary native smoke programs even on failure
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("native-smoke.py", "native-chime", "native-chime.rs"):
              (root / name).unlink(missing_ok=True)
          PY
      - name: Upload native output and visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-proof-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-proof
      - name: Upload extracted and exercised release package
        if: inputs.release-packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: miccamwatch-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
