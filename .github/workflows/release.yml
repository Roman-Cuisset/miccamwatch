name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    if: github.ref != 'refs/tags/v0.14.0' && vars.WINDOWS_RELEASE_APPROVED == 'true'
    runs-on: windows-latest
    environment: release
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
      - run: cargo build --release --locked --features windows-tray
      - name: Restore pinned installer toolchain
        run: dotnet tool restore
      - name: Sign executables when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK signtool is required for signing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'mcw-release-certificate.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
            foreach ($file in @('target/release/mcw.exe', 'target/release/mcw-tray.exe')) {
              & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $certificate.Thumbprint $file
              if ($LASTEXITCODE -ne 0) { throw "Executable signing failed: $file" }
              & $tool.FullName verify /pa /all /v $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $file" }
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or -not $signature.TimeStamperCertificate) {
                throw "Expected valid timestamped signature was not found: $file"
              }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }
      - name: Build per-user MSI
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          dotnet wix build installer/miccamwatch.wxs -d Version=$version -d Executable=target/release/mcw.exe -d TrayExecutable=target/release/mcw-tray.exe -o miccamwatch-windows-x86_64.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
      - name: Sign MSI when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK signtool is required for signing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'mcw-release-certificate.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
            & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $certificate.Thumbprint miccamwatch-windows-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }
            & $tool.FullName verify /pa /all /v miccamwatch-windows-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw 'MSI Authenticode verification failed' }
            $signature = Get-AuthenticodeSignature miccamwatch-windows-x86_64.msi
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or -not $signature.TimeStamperCertificate) {
              throw 'Expected valid timestamped MSI signature was not found'
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }
      - name: Report unsigned release boundary
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 == '' }}
        shell: pwsh
        run: |
          'Windows certificate is not configured: both EXEs and MSI are unsigned. No antivirus clearance is asserted.' >> $env:GITHUB_STEP_SUMMARY
      - name: Package and exercise Windows distribution
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          Compress-Archive -Path target/release/mcw.exe,target/release/mcw-tray.exe,README.md,LICENSE -DestinationPath miccamwatch-windows-x86_64.zip
          $smoke = Join-Path $env:RUNNER_TEMP 'mcw-release-smoke'
          Expand-Archive miccamwatch-windows-x86_64.zip $smoke
          $cli = Join-Path $smoke 'mcw.exe'
          $tray = Join-Path $smoke 'mcw-tray.exe'
          if ((& $cli --version) -ne "mcw $version") { throw 'ZIP version mismatch' }
          Start-Process -FilePath $tray
          Start-Sleep -Seconds 2
          try {
            & $cli tray status
            if ($LASTEXITCODE -ne 0) { throw 'Packaged tray did not start' }
          } finally {
            & $cli tray stop
          }
          $msi = (Resolve-Path miccamwatch-windows-x86_64.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed: $($install.ExitCode)" }
          try {
            $installed = Join-Path $env:LOCALAPPDATA 'Programs\MicCamWatch\mcw.exe'
            if ((& $installed --version) -ne "mcw $version") { throw 'MSI version mismatch' }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            miccamwatch-windows-x86_64.zip
            miccamwatch-windows-x86_64.msi

  portable:
    if: github.ref != 'refs/tags/v0.14.0'
    uses: ./.github/workflows/ci.yml
    with:
      native-only: true
      release-packages: true

  publish:
    if: ${{ always() && github.ref != 'refs/tags/v0.14.0' && needs.portable.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    needs: [windows, portable]
    runs-on: ubuntu-latest
    env:
      WINDOWS_ARTIFACTS: ${{ needs.windows.result == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/miccamwatch-sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false
      - name: Verify complete asset set and generate unified checksums
        working-directory: dist
        shell: bash
        run: |
          for asset in miccamwatch-linux-x86_64.tar.gz miccamwatch-macos-aarch64.tar.gz miccamwatch-macos-x86_64.tar.gz miccamwatch-macos-aarch64.dmg miccamwatch-macos-x86_64.dmg miccamwatch-sbom.spdx.json; do
            test -s "$asset"
          done
          if [ "$WINDOWS_ARTIFACTS" = true ]; then
            test -s miccamwatch-windows-x86_64.zip
            test -s miccamwatch-windows-x86_64.msi
          fi
          sha256sum miccamwatch-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/miccamwatch-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-bundle
          if-no-files-found: error
          path: dist/*
      - name: Publish complete GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ vars.WINDOWS_RELEASE_APPROVED != 'true' }}
          make_latest: ${{ vars.WINDOWS_RELEASE_APPROVED == 'true' }}
          body: |
            ## 0.19.0 — Direct tray profiles and Windows lifecycle fixes

            - Windows and Linux now join macOS with four direct, checked tray profiles: Balanced, Private, Meeting and Development. Selection persists across restart; explicit --config remains authoritative and disables profile changes. The Windows parent caption shows the selected localized profile or the config override. Profile selection never grants capture permission or implicitly releases protection.
            - Windows uses the first known session state as a passive startup baseline, not a new lock event. Stored requested protections and pending restoration are not reset. A requested camera Block whose guard is unavailable offers Restart camera protection (UAC)… without an intermediary Allow; restart revalidates current intent and preserves restoration ownership.
            - Native Windows IPC waits at most three seconds for connection admission to a busy pipe. Peer authentication is unchanged; command bytes are sent once, and no possibly applied command is replayed. Microphone broker retirement now coordinates preparing/queued requests with a fresh reconciliation before shutdown, without increasing request deadlines.
            - Windows tray restart uses CreateProcessW with handle inheritance disabled, fixing captured-stream EOF for the 0.19.0 invoking updater. Already-running legacy clients retain their own EOF defect even after replacing their files; this is not a retrospective fix for old published updaters.
            - Healthy active trays with inactive protection passed native replacement and mixed-pair repair without manual Exit. Real active/requested protection, automatic ownership, foreign owners and pending/unknown restoration still refuse before tray stop or file replacement. There is no implicit unmute, camera Allow or guard takeover. Before changing protected binaries, explicitly release through the matching version and complete owned restoration; killing the guard or closing its frontend is not a workaround. External MSI/manual replacement retains the same precautions.
            - Microphone failures retain the original IPC error. An occupied lease alone proves neither a different namespace nor missing administrator rights; an incompatible guard version is also possible. Version, source and ownership checks remain enforced.
            - The tray begins with a neutral identity and exposes its current bounded headline, with complete diagnostics in Status details. [Native product qualification](https://github.com/Roman-Cuisset/miccamwatch/actions/runs/39312572930) passed functional scenarios on all four platforms; Windows still failed the strict Explorer popup observation. Windows UIA/Explorer popup automation remains unqualified despite positive Windows user feedback. [Pre-publication packaging](https://github.com/Roman-Cuisset/miccamwatch/actions/runs/39379984562) passed Windows, Linux and both macOS architectures; those runs did not publish 0.19.0 or qualify its public acquisition path.
            - Publication is tags-only. WINDOWS_RELEASE_APPROVED=true and a successful Windows build remain required for coordinated stable/latest publication; without approval this is an explicitly selected Unix prerelease, not a stable/latest replacement. The Unix installer follows stable without --version; use --version ${{ github.ref_name }} to pin this release.
            - Windows EXE/MSI artifacts are unsigned unless a real configured certificate signs and verifies them; the qualified pre-publication artifacts are unsigned. macOS apps are ad-hoc sealed, not Developer ID signed or notarized. No antivirus clearance, Gatekeeper/quarantine bypass or physical microphone/camera enforcement certification is claimed. SHA256SUMS, build provenance and the SBOM remain provided; source/version/attestation checks and earlier immutable tags/assets are unchanged.
          files: |
            dist/miccamwatch-*
            dist/SHA256SUMS
