name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
      - run: cargo build --release --locked --features windows-tray
      - name: Restore pinned installer toolchain
        run: dotnet tool restore
      - name: Sign executables when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD target/release/mcw.exe target/release/mcw-tray.exe
          if ($LASTEXITCODE -ne 0) { throw 'Executable signing failed' }
          Remove-Item certificate.pfx
      - name: Build per-user MSI
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          dotnet wix build installer/miccamwatch.wxs -d Version=$version -d Executable=target/release/mcw.exe -d TrayExecutable=target/release/mcw-tray.exe -o miccamwatch-windows-x86_64.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
      - name: Sign MSI when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD miccamwatch-windows-x86_64.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }
          Remove-Item certificate.pfx
      - name: Package and exercise Windows distribution
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          Compress-Archive -Path target/release/mcw.exe,target/release/mcw-tray.exe,README.md,LICENSE -DestinationPath miccamwatch-windows-x86_64.zip
          $smoke = Join-Path $env:RUNNER_TEMP 'mcw-release-smoke'
          Expand-Archive miccamwatch-windows-x86_64.zip $smoke
          $cli = Join-Path $smoke 'mcw.exe'
          $tray = Join-Path $smoke 'mcw-tray.exe'
          if ((& $cli --version) -ne "mcw $version") { throw 'ZIP version mismatch' }
          Start-Process -FilePath $tray
          Start-Sleep -Seconds 2
          try {
            & $cli tray status
            if ($LASTEXITCODE -ne 0) { throw 'Packaged tray did not start' }
          } finally {
            & $cli tray stop
          }
          $msi = (Resolve-Path miccamwatch-windows-x86_64.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed: $($install.ExitCode)" }
          try {
            $installed = Join-Path $env:LOCALAPPDATA 'Programs\MicCamWatch\mcw.exe'
            if ((& $installed --version) -ne "mcw $version") { throw 'MSI version mismatch' }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: miccamwatch-sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            miccamwatch-windows-x86_64.zip
            miccamwatch-windows-x86_64.msi
            miccamwatch-sbom.spdx.json

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Verify architecture and release version
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual=$(uname -m)
          case "$actual" in arm64) actual=aarch64 ;; esac
          test "$actual" = "$EXPECTED_ARCH"
          if [ "$RUNNER_OS" = macOS ]; then
            version=$(sw_vers -productVersion)
            echo "macOS runtime: $version"
            test "${version%%.*}" -ge 15
          fi
          python3 -c 'import json, os, subprocess; v=json.loads(subprocess.check_output(["cargo","metadata","--no-deps","--format-version","1"]))["packages"][0]["version"]; assert os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] == "v" + v'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Package and exercise native Unix distribution
        shell: bash
        env:
          PACKAGE: miccamwatch-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
        run: |
          tar -czf "$PACKAGE" -C target/release mcw -C "$GITHUB_WORKSPACE" README.md LICENSE
          smoke=$(mktemp -d)
          tar -xzf "$PACKAGE" -C "$smoke"
          export MCW_RELEASE_BINARY="$smoke/mcw"
          python3 - <<'PY'
          import json, os, signal, subprocess, time
          binary = os.environ['MCW_RELEASE_BINARY']
          version = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))['packages'][0]['version']
          assert subprocess.check_output([binary, '--version'], text=True).strip() == 'mcw ' + version
          status = subprocess.run([binary, 'status', '--json'], capture_output=True, text=True)
          assert status.returncode in (0, 1, 2), status.stderr
          document = json.loads(status.stdout)
          expected = {'coreaudio_input', 'avfoundation_video'} if os.environ['RUNNER_OS'] == 'macOS' else {'pipewire_audio', 'pipewire_video'}
          collectors = {row['collector']: row for row in document['collectors']}
          assert set(collectors) == expected
          assert 'capture helper unavailable' not in str(document).lower()
          if os.environ['RUNNER_OS'] == 'macOS':
              assert collectors['avfoundation_video']['state'] == 'degraded'
          doctor = subprocess.run([binary, 'doctor', '--json'], capture_output=True, text=True)
          assert doctor.returncode in (0, 2), doctor.stderr
          assert {row['name'] for row in json.loads(doctor.stdout)} == expected
          devices = subprocess.run([binary, 'devices', '--json'], capture_output=True, text=True)
          assert devices.returncode in (0, 2), devices.stderr
          if os.environ['RUNNER_OS'] == 'macOS':
              assert devices.returncode == 0, devices.stderr
          if devices.returncode == 0:
              json.loads(devices.stdout)
          watch = subprocess.Popen([binary, 'watch', '--json', '--interval', '200'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, start_new_session=True)
          try:
              time.sleep(8)
              assert watch.poll() is None, 'watch exited before SIGINT'
              os.killpg(watch.pid, signal.SIGINT)
              out, err = watch.communicate(timeout=15)
              assert watch.returncode == 0, err
              for line in out.splitlines():
                  json.loads(line)
          finally:
              if watch.poll() is None:
                  os.killpg(watch.pid, signal.SIGKILL)
                  watch.wait()
          print('Extracted release binary verified:', binary, version)
          PY
          rm -rf "$smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: miccamwatch-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  publish:
    needs: [windows, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and generate unified checksums
        working-directory: dist
        shell: bash
        run: |
          for asset in miccamwatch-windows-x86_64.zip miccamwatch-windows-x86_64.msi miccamwatch-linux-x86_64.tar.gz miccamwatch-macos-aarch64.tar.gz miccamwatch-macos-x86_64.tar.gz miccamwatch-sbom.spdx.json; do
            test -s "$asset"
          done
          sha256sum miccamwatch-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/miccamwatch-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-bundle
          if-no-files-found: error
          path: dist/*
      - name: Publish complete GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Native capture collectors and coordinated Windows updates
            - Windows x64: portable CLI + windowless tray ZIP and per-user MSI; matching CLI/tray updates repair stale autostart binaries.
            - Experimental Linux x64 CLI: PipeWire graph capture, authenticated Client PID plus /proc identity, conservative V4L2 readiness, status/devices/doctor/watch.
            - Experimental macOS 15+ CLI for Apple Silicon and Intel: CoreAudio input activity and passive AVFoundation camera signal. Camera PID is always null, application unknown, enforcement Unknown; coverage remains degraded.
            - Archives are extracted and exercised on native runners before publication. SHA256SUMS and build provenance cover all distributables; the SBOM describes dependencies.
            - Linux binary built on Ubuntu 22.04 (glibc 2.35 baseline). Install pw-dump and use an accessible user PipeWire socket. macOS binaries require macOS 15+; no Apple Developer ID/notarization is claimed.
            - Physical microphone/camera transitions remain unverified. Real PipeWire virtual-source START/STOP and authenticated PID were verified separately; CI is not proof of hardware capture. Unix has no tray, hardware blocking, mute, notifications or self-update.
          files: |
            dist/miccamwatch-windows-x86_64.zip
            dist/miccamwatch-windows-x86_64.msi
            dist/miccamwatch-linux-x86_64.tar.gz
            dist/miccamwatch-macos-aarch64.tar.gz
            dist/miccamwatch-macos-x86_64.tar.gz
            dist/SHA256SUMS
            dist/miccamwatch-sbom.spdx.json
