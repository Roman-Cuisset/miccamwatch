name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
      - run: cargo build --release --locked
      - name: Package executable and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/mcw.exe -DestinationPath miccamwatch-windows-x86_64.zip
          $hash = (Get-FileHash miccamwatch-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  miccamwatch-windows-x86_64.zip" | Out-File -Encoding ascii -NoNewline SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: target/release/mcw.exe
          format: spdx-json
          output-file: miccamwatch-windows-x86_64.spdx.json
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: miccamwatch-windows-x86_64.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            miccamwatch-windows-x86_64.zip
            SHA256SUMS
            miccamwatch-windows-x86_64.spdx.json
