name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    if: github.ref != 'refs/tags/v0.14.0' && vars.WINDOWS_RELEASE_APPROVED == 'true'
    runs-on: windows-latest
    environment: release
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
      - run: cargo build --release --locked --features windows-tray
      - name: Restore pinned installer toolchain
        run: dotnet tool restore
      - name: Sign executables when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK signtool is required for signing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'mcw-release-certificate.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
            foreach ($file in @('target/release/mcw.exe', 'target/release/mcw-tray.exe')) {
              & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $certificate.Thumbprint $file
              if ($LASTEXITCODE -ne 0) { throw "Executable signing failed: $file" }
              & $tool.FullName verify /pa /all /v $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $file" }
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or -not $signature.TimeStamperCertificate) {
                throw "Expected valid timestamped signature was not found: $file"
              }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }
      - name: Build per-user MSI
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          dotnet wix build installer/miccamwatch.wxs -d Version=$version -d Executable=target/release/mcw.exe -d TrayExecutable=target/release/mcw-tray.exe -o miccamwatch-windows-x86_64.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
      - name: Sign MSI when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK signtool is required for signing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'mcw-release-certificate.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
            & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $certificate.Thumbprint miccamwatch-windows-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }
            & $tool.FullName verify /pa /all /v miccamwatch-windows-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw 'MSI Authenticode verification failed' }
            $signature = Get-AuthenticodeSignature miccamwatch-windows-x86_64.msi
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or -not $signature.TimeStamperCertificate) {
              throw 'Expected valid timestamped MSI signature was not found'
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }
      - name: Report unsigned release boundary
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 == '' }}
        shell: pwsh
        run: |
          'Windows certificate is not configured: both EXEs and MSI are unsigned. No antivirus clearance is asserted.' >> $env:GITHUB_STEP_SUMMARY
      - name: Package and exercise Windows distribution
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $receipt = & target/release/mcw.exe __portable-receipt
          if ($LASTEXITCODE -ne 0) { throw 'Portable ownership receipt generation failed' }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'target/release/.miccamwatch-portable.json'), $receipt, [Text.UTF8Encoding]::new($false))
          Compress-Archive -Path target/release/mcw.exe,target/release/mcw-tray.exe,target/release/.miccamwatch-portable.json,README.md,LICENSE -DestinationPath miccamwatch-windows-x86_64.zip
          $smoke = Join-Path $env:RUNNER_TEMP 'mcw-release-smoke'
          Expand-Archive miccamwatch-windows-x86_64.zip $smoke
          $cli = Join-Path $smoke 'mcw.exe'
          $tray = Join-Path $smoke 'mcw-tray.exe'
          if ((& $cli --version) -ne "mcw $version") { throw 'ZIP version mismatch' }
          Start-Process -FilePath $tray
          Start-Sleep -Seconds 2
          try {
            & $cli tray status
            if ($LASTEXITCODE -ne 0) { throw 'Packaged tray did not start' }
          } finally {
            & $cli tray stop
          }
          $msi = (Resolve-Path miccamwatch-windows-x86_64.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed: $($install.ExitCode)" }
          try {
            $installed = Join-Path $env:LOCALAPPDATA 'Programs\MicCamWatch\mcw.exe'
            if ((& $installed --version) -ne "mcw $version") { throw 'MSI version mismatch' }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            miccamwatch-windows-x86_64.zip
            miccamwatch-windows-x86_64.msi

  portable:
    if: github.ref != 'refs/tags/v0.14.0'
    uses: ./.github/workflows/ci.yml
    with:
      native-only: true
      release-packages: true

  publish:
    if: ${{ always() && github.ref != 'refs/tags/v0.14.0' && needs.portable.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    needs: [windows, portable]
    runs-on: ubuntu-latest
    env:
      WINDOWS_ARTIFACTS: ${{ needs.windows.result == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/miccamwatch-sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false
      - name: Verify complete asset set and generate unified checksums
        working-directory: dist
        shell: bash
        run: |
          for asset in miccamwatch-linux-x86_64.tar.gz miccamwatch-linux-aarch64.tar.gz miccamwatch-macos-aarch64.tar.gz miccamwatch-macos-x86_64.tar.gz miccamwatch-macos-aarch64.dmg miccamwatch-macos-x86_64.dmg miccamwatch-sbom.spdx.json; do
            test -s "$asset"
          done
          if [ "$WINDOWS_ARTIFACTS" = true ]; then
            test -s miccamwatch-windows-x86_64.zip
            test -s miccamwatch-windows-x86_64.msi
          fi
          sha256sum miccamwatch-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/miccamwatch-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-bundle
          if-no-files-found: error
          path: dist/*
      - name: Publish complete GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ vars.WINDOWS_RELEASE_APPROVED != 'true' }}
          make_latest: ${{ vars.WINDOWS_RELEASE_APPROVED == 'true' }}
          body: |
            ## 0.21.0 — Native desktop interfaces, unified activation and Linux ARM64

            ### Signing and hardware validation — important

            - **Windows:** the verified preparation's `mcw.exe`, `mcw-tray.exe` and MSI are **unsigned (`NotSigned`)**, without a verified publisher or timestamp. The tag workflow signs only when a production certificate is configured; check the actual tag files separately. Checksums and provenance do not establish SmartScreen/Defender clearance.
            - **macOS:** applications are **ad-hoc sealed, not Developer ID signed and not notarized**. Successful seal verification does not guarantee Gatekeeper acceptance; do not disable OS protections to install.
            - **Linux ARM64:** native hosted build/tests passed, but **physical Raspberry Pi/SBC, peripheral and capture-control compatibility has not been validated**. These GNU packages retain glibc 2.35+/PipeWire prerequisites; ARMv7, musl and non-USB/CSI camera enforcement are not claimed.

            ### Changes

            - Adds redesigned native Win32, GTK3 and AppKit consultation interfaces with Overview, Settings, Diagnostics and localized About information. Current observations, collector health and requested versus effective protection remain distinct; partial/unknown coverage is never an all-clear.
            - Unifies `mcw tray open`, desktop/Finder/Start Menu activation and retained-window behavior: explicit launch reuses the authenticated owner/window for the same installation and data namespace; closing hides the consultation without stopping monitoring, while background/autostart launches stay hidden. Windows retains its CLI and console-free companion as two executables for one application, not two independent desktop applications.
            - Adds persistent native profile, notification, sound and local-history preferences, notification pause and explicit autostart controls without granting permissions or enabling protection merely by opening a window. Explicit `--config` remains authoritative. Refresh preserves native reading/navigation state; full selectable/copyable diagnostics remain separate from compact headlines.
            - Fixes preference-refresh ordering and notification/history gating: sound requires enabled, unpaused notifications, enabled sound and a confirmed Active capture start, not Ready/Update/Stop. Linux camera preflight checks the fixed helper/`pkexec` prerequisites without treating inventory as authorization. Native API acceptance is not guaranteed notification visibility or audible sound.
            - Strengthens owned activation and maintenance: Unix sockets are privately prepared before exclusive atomic publication, macOS open delivery no longer waits behind collector polling, and managed Linux launcher/icon receipts retain quoting, rollback, foreign-file refusal and exact `MicCamWatch` window identity. Windows MSI-owned installations refuse binary self-update before network/staging/frontend stop and direct users to Windows Installer; this is not an automated MSI upgrade. Existing authentication, privilege and restoration boundaries remain enforced.
            - Adds `miccamwatch-linux-aarch64.tar.gz` for native `aarch64-unknown-linux-gnu` alongside x86_64. Both Linux packages retain the Ubuntu 22.04 / glibc 2.35 and PipeWire/SPA 0.3.48 baseline. User/root helper installers validate both executables' ELF class, byte order, ABI, executable type and machine before probing; checksums, permissions, ownership receipts and restoration safeguards remain enforced. ARMv7/32-bit and musl are unsupported.
            - Native hosted ARM qualification records actual host/toolchain/header versions, generated bindings and both ELF identities and exercises native SPA, CLI/PTY, PipeWire, desktop and privilege-boundary scenarios. It is not physical Raspberry Pi/SBC, peripheral, camera-enforcement or capture-transition certification. No historical pre-0.21 public ARM migration or 0.16.1 resource baseline exists; missing comparisons stay unqualified. No global 15 MB resource-budget success is asserted.
            - Reorganizes installation, usage/safety, validation, release-history and architecture documentation while retaining historical evidence and screenshot provenance. Read `docs/RELEASE_0.21.0.md` for the prepared release checklist and `docs/VALIDATION.md` for source-specific native proofs, simulated GUI observation fixtures and open manual/hardware limits. Earlier platform runs alone are not qualification of a new integrated revision.
            - Platform scope remains Windows 10/11 x64, desktop GNU/Linux x64/ARM64 with glibc 2.35+ (GTK3/graphical session for consultation), and macOS 15+ Apple Silicon/Intel. Windows standard-user portable/MSI/Cargo qualification passed in the recorded disposable interactive guest; MSI upgrade/repair, Windows 10/DPI/accessibility, real Wayland and physical ARM/device/OS-authorization validation require separate evidence. macOS camera client/PID remains unknown; SDK mute is not capture-permission denial. Release/restore owned protection explicitly before external replacement/removal.
            - The complete approved-Windows set is ten uploaded assets: two Windows packages, two Linux archives, four macOS archives/DMGs, SPDX SBOM and `SHA256SUMS`. Nine payload/SBOM files are checksummed and provenance-attested; the manifest is not itself attested. Tags-only publication and the approved-Windows stable/latest gate are unchanged; without Windows approval the existing path is Unix-only prerelease, not the complete stable set. Windows signing depends on the configured certificate and otherwise remains unsigned; macOS apps are ad-hoc sealed, not Developer ID signed/notarized. Checksums/provenance are not antivirus, SmartScreen/Gatekeeper clearance or OS authorization. Prior tags/assets remain immutable; public ARM installer proof is opt-in only after an archive is actually published.
          files: |
            dist/miccamwatch-*
            dist/SHA256SUMS
