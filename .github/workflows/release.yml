name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    if: github.ref != 'refs/tags/v0.14.0' && vars.WINDOWS_RELEASE_APPROVED == 'true'
    runs-on: windows-latest
    environment: release
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }
      - run: cargo build --release --locked --features windows-tray
      - name: Restore pinned installer toolchain
        run: dotnet tool restore
      - name: Sign executables when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK signtool is required for signing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'mcw-release-certificate.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
            foreach ($file in @('target/release/mcw.exe', 'target/release/mcw-tray.exe')) {
              & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $certificate.Thumbprint $file
              if ($LASTEXITCODE -ne 0) { throw "Executable signing failed: $file" }
              & $tool.FullName verify /pa /all /v $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $file" }
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or -not $signature.TimeStamperCertificate) {
                throw "Expected valid timestamped signature was not found: $file"
              }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }
      - name: Build per-user MSI
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          dotnet wix build installer/miccamwatch.wxs -d Version=$version -d Executable=target/release/mcw.exe -d TrayExecutable=target/release/mcw-tray.exe -o miccamwatch-windows-x86_64.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
      - name: Sign MSI when release certificate is configured
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK signtool is required for signing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'mcw-release-certificate.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.HasPrivateKey) { throw 'Signing certificate has no private key' }
            & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $certificate.Thumbprint miccamwatch-windows-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }
            & $tool.FullName verify /pa /all /v miccamwatch-windows-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw 'MSI Authenticode verification failed' }
            $signature = Get-AuthenticodeSignature miccamwatch-windows-x86_64.msi
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or -not $signature.TimeStamperCertificate) {
              throw 'Expected valid timestamped MSI signature was not found'
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }
      - name: Report unsigned release boundary
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 == '' }}
        shell: pwsh
        run: |
          'Windows certificate is not configured: both EXEs and MSI are unsigned. No antivirus clearance is asserted.' >> $env:GITHUB_STEP_SUMMARY
      - name: Package and exercise Windows distribution
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          Compress-Archive -Path target/release/mcw.exe,target/release/mcw-tray.exe,README.md,LICENSE -DestinationPath miccamwatch-windows-x86_64.zip
          $smoke = Join-Path $env:RUNNER_TEMP 'mcw-release-smoke'
          Expand-Archive miccamwatch-windows-x86_64.zip $smoke
          $cli = Join-Path $smoke 'mcw.exe'
          $tray = Join-Path $smoke 'mcw-tray.exe'
          if ((& $cli --version) -ne "mcw $version") { throw 'ZIP version mismatch' }
          Start-Process -FilePath $tray
          Start-Sleep -Seconds 2
          try {
            & $cli tray status
            if ($LASTEXITCODE -ne 0) { throw 'Packaged tray did not start' }
          } finally {
            & $cli tray stop
          }
          $msi = (Resolve-Path miccamwatch-windows-x86_64.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed: $($install.ExitCode)" }
          try {
            $installed = Join-Path $env:LOCALAPPDATA 'Programs\MicCamWatch\mcw.exe'
            if ((& $installed --version) -ne "mcw $version") { throw 'MSI version mismatch' }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            miccamwatch-windows-x86_64.zip
            miccamwatch-windows-x86_64.msi

  portable:
    if: github.ref != 'refs/tags/v0.14.0'
    uses: ./.github/workflows/ci.yml
    with:
      native-only: true
      release-packages: true

  publish:
    if: ${{ always() && github.ref != 'refs/tags/v0.14.0' && needs.portable.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    needs: [windows, portable]
    runs-on: ubuntu-latest
    env:
      WINDOWS_ARTIFACTS: ${{ needs.windows.result == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/miccamwatch-sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false
      - name: Verify complete asset set and generate unified checksums
        working-directory: dist
        shell: bash
        run: |
          for asset in miccamwatch-linux-x86_64.tar.gz miccamwatch-macos-aarch64.tar.gz miccamwatch-macos-x86_64.tar.gz miccamwatch-sbom.spdx.json; do
            test -s "$asset"
          done
          if [ "$WINDOWS_ARTIFACTS" = true ]; then
            test -s miccamwatch-windows-x86_64.zip
            test -s miccamwatch-windows-x86_64.msi
          fi
          sha256sum miccamwatch-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/miccamwatch-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-bundle
          if-no-files-found: error
          path: dist/*
      - name: Publish complete GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ vars.WINDOWS_RELEASE_APPROVED != 'true' }}
          make_latest: ${{ vars.WINDOWS_RELEASE_APPROVED == 'true' }}
          body: |
            ## Scoped native privacy tools and coordinated Windows updates
            - Windows remains supported and is validated by CI. New Windows ZIP/MSI publication is held unless the repository variable WINDOWS_RELEASE_APPROVED is explicitly set to true. This gate is independent of signing: a configured certificate signs and verifies both EXEs and MSI; absent a certificate they are unsigned. Neither signing, tests nor provenance is antivirus clearance. Quarantined executables are not restored or automatically reinstalled.
            - While Windows publication is held, this is an explicitly selected Unix prerelease, not the latest stable release. Install with the public installer and --version ${{ github.ref_name }}; v0.14.0 remains the stable latest channel for existing Windows installers/updaters.
            - Linux x64: PipeWire graph capture with authenticated client PID and /proc identity, conservative V4L2 readiness, session-only PipeWire source mute, real StatusNotifier tray, native desktop notifications/sound/journal delivery, managed desktop autostart, profiles/history, shared TUI, and ownership-checked user-prefix updates. Linux camera blocking is unavailable; supported session-lock actions require usable local graphical logind evidence.
            - macOS 15+ Apple Silicon and Intel: CoreAudio input activity, writable INPUT mute only, native AppKit menu bar, notifications/sound/unified log, managed LaunchAgent autostart, profiles/history, shared TUI, and ownership-checked user-prefix updates. Camera blocking is a manually reviewed/approved Restrictions profile, not a silent camera or TCC switch. Public screen-lock state remains Unknown; no automatic macOS lock enforcement is claimed.
            - macOS camera evidence is passive AVFoundation discovery only: client PID is null, application is unknown, enforcement is Unknown and coverage is degraded. No capture session or camera/microphone permission request is made to improve runner coverage.
            - Linux is built on Ubuntu 22.04 (glibc 2.35 baseline; PipeWire 0.3.48 supported). Runtime needs libpipewire-0.3/libspa-0.2, pw-dump and an accessible user PipeWire socket; desktop features additionally need session D-Bus, a real StatusNotifier host/panel and notification daemon. Sound needs canberra-gtk-play. Build prerequisites are installed only on ephemeral CI runners.
            - macOS needs macOS 15+ and a logged-in Aqua/WindowServer session for the menu bar; native notifications and screenshot evidence may require user authorization. No Apple Developer ID, notarization, permission grant or physical-device compatibility is asserted.
            - All three Unix architectures run format/clippy/test/build and extracted-package native smoke. Linux smoke uses a real XFCE panel under Xvfb, notification daemon, session D-Bus, isolated virtual PipeWire capture, actual PTY uppercase/cancel/quit, and a real service outage with no fabricated START/STOP. macOS attempts native menu-bar lifecycle and captures native output; absent Aqua/Screen Recording prerequisites are explicit evidence, not a silently passed GUI test. Screenshots/native-proof artifacts require review and are not physical capture proof.
            - Physical microphone/camera capture, physical mute, real lock/unlock transitions, manually installed macOS Restrictions-profile effectiveness and native notification authorization remain unverified by hosted CI. SHA256SUMS and build provenance cover distributables; the SBOM describes dependencies. Existing v0.14.0 tag/assets are left untouched and excluded from publication by this workflow.
          files: |
            dist/miccamwatch-*
            dist/SHA256SUMS
