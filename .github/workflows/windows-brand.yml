name: Windows hosted interactive-session prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-context:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read existing desktop and RDP capabilities without changing policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          $proof = Join-Path $env:RUNNER_TEMP 'interactive-prerequisites'
          New-Item -ItemType Directory -Path $proof | Out-Null
          $policy = Get-ItemProperty 'HKLM:/SYSTEM/CurrentControlSet/Control/Terminal Server'
          $listener = Get-ItemProperty 'HKLM:/SYSTEM/CurrentControlSet/Control/Terminal Server/WinStations/RDP-Tcp'
          $control = [Type]::GetTypeFromProgID('MsRdpClient10NotSafeForScripting')
          $certificates = @(Get-ChildItem 'Cert:/LocalMachine/Remote Desktop' -ErrorAction SilentlyContinue | ForEach-Object { @{subject=$_.Subject;thumbprint=$_.Thumbprint;notAfter=$_.NotAfter;certificate=[Convert]::ToBase64String($_.RawData)} })
          @{
            terminalService=(Get-Service TermService | Select-Object Status,StartType,Name)
            installerService=(Get-Service msiserver | Select-Object Status,StartType,Name)
            denyConnections=$policy.fDenyTSConnections
            port=$listener.PortNumber
            nlaRequired=$listener.UserAuthentication
            activeXAvailable=($null -ne $control)
            controlClsid=$(if ($control) { $control.GUID.ToString() } else { $null })
            certificates=$certificates
            listeners=@(Get-NetTCPConnection -LocalPort $listener.PortNumber -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,OwningProcess)
            remoteDesktopGroup=(Get-LocalGroup -SID 'S-1-5-32-555' | Select-Object Name,SID)
          } | ConvertTo-Json -Depth 8 | Out-File -LiteralPath (Join-Path $proof 'capabilities.json') -Encoding utf8
          & quser.exe *> (Join-Path $proof 'sessions.log')
      - name: Retain read-only native capability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-interactive-prerequisites
          path: ${{ runner.temp }}/interactive-prerequisites
          if-no-files-found: error
          retention-days: 7
