name: Genuine ordinary Windows desktop prototype

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ordinary-interactive:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-windows-brand-shell
          run-id: 39625449451
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-native
      - name: Exercise actual tray on strict fresh-user interactive desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          $stage = Join-Path $env:PUBLIC 'Documents/mcw-interactive-proof'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $previous = Join-Path $env:RUNNER_TEMP 'previous-native'
          $msi = Join-Path $previous 'miccamwatch/miccamwatch/target/mcw-brand-fixture.msi'
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -cne 'F37927EA1681738F0FDF49377F210812F1C0B8BF80489FB01900A3C59F5CCB66') { throw 'Retained exact MSI hash mismatch' }
          $payload = Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          foreach ($name in @('mcw.exe','mcw-tray.exe')) { Copy-Item -LiteralPath (Join-Path $previous "_temp/windows-brand-proof/installed-before-cleanup/$name") -Destination $payload }
          foreach ($name in @('windows_ordinary.py','windows_interactive_probe.ps1','windows_frontend_probe.py','windows_desktop_capture.ps1','windows_certificate_consent.ps1','native_uninstall.py')) { Copy-Item -LiteralPath (Join-Path 'installer/tests' $name) -Destination $stage }
          $python = (Get-Command python.exe).Source
          $fixture = Join-Path $stage 'frontend.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $stage = $PSScriptRoot
          $proof = Join-Path $stage 'frontend-proof'
          & python.exe (Join-Path $stage 'windows_frontend_probe.py') --payload (Join-Path $stage 'payload') --proof $proof
          if ($LASTEXITCODE -ne 0) { throw 'Actual frontend probe failed' }
          $result = Get-Content -LiteralPath (Join-Path $proof 'frontend-observation.json') -Raw | ConvertFrom-Json
          if ($result.status -ne 'observations_complete' -or $result.hosts.Count -ne 2) { throw 'Both actual frontend hosts did not finish' }
          foreach ($hostResult in $result.hosts) {
            if (-not $hostResult.window_ready -or $hostResult.cooperative_stop_exit -ne 0 -or $hostResult.exit_after_observation -ne 0) { throw 'Actual frontend readiness/cooperative stop failed; original evidence retained' }
          }
          '@ | Set-Content -LiteralPath $fixture -Encoding UTF8
          $captureArgs = @('-NoProfile','-STA','-File',(Join-Path $stage 'windows_desktop_capture.ps1'),'-OutputDirectory',$stage)
          $capture = Start-Process powershell.exe -ArgumentList $captureArgs -PassThru -RedirectStandardOutput (Join-Path $stage 'capture.stdout.log') -RedirectStandardError (Join-Path $stage 'capture.stderr.log')
          $providerArgs = @('-NoProfile','-STA','-File',(Join-Path $stage 'windows_interactive_probe.ps1'),'-StageDirectory',$stage,'-FixtureScript',$fixture,'-PythonExe',$python,'-ReportPath',(Join-Path $stage 'interactive-provider.json'),'-TimeoutSeconds','300')
          $provider = Start-Process powershell.exe -ArgumentList $providerArgs -PassThru -RedirectStandardOutput (Join-Path $stage 'provider.stdout.log') -RedirectStandardError (Join-Path $stage 'provider.stderr.log')
          $consentArgs = @('-NoProfile','-STA','-File',(Join-Path $stage 'windows_certificate_consent.ps1'),'-StageDirectory',$stage,'-ProviderProcessId',$provider.Id)
          $consent = Start-Process powershell.exe -ArgumentList $consentArgs -PassThru -RedirectStandardOutput (Join-Path $stage 'consent.stdout.log') -RedirectStandardError (Join-Path $stage 'consent.stderr.log')
          if (-not $provider.WaitForExit(330000)) { throw 'Provider remains live in a blocking native API; retained untouched for disposable VM teardown, inspect last stage and screenshot' }
          if ($provider.ExitCode -ne 0) { throw 'Genuine interactive desktop did not qualify; inspect original provider evidence' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-ordinary-interactive
          path: C:/Users/Public/Documents/mcw-interactive-proof
          if-no-files-found: error
          retention-days: 7
