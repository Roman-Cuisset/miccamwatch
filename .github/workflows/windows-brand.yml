name: Windows shared ordinary-session launcher diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-context:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise shared launcher with actual native namespaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          $stage = Join-Path ([Environment]::GetFolderPath('CommonDocuments')) ('MicCamWatch-context-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $stage | Out-Null
          "MCW_CONTEXT_PROOF=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $probe = Join-Path $stage 'probe.py'
          Copy-Item -LiteralPath 'installer/tests/windows_context_probe.py' -Destination $probe
          $python = (Get-Command python).Source
          $ordinary = Join-Path $stage 'ordinary.json'
          $wrapper = Join-Path $stage 'ordinary.ps1'
          $body = @"
          `$ErrorActionPreference = 'Continue'
          & '$($python.Replace("'", "''"))' -B '$($probe.Replace("'", "''"))' | Out-File -LiteralPath '$($ordinary.Replace("'", "''"))' -Encoding utf8
          exit `$LASTEXITCODE
          "@
          [IO.File]::WriteAllText($wrapper,$body)
          & $python -u -B installer/tests/windows_ordinary.py --script $wrapper --working-directory $stage --timeout 180 --report (Join-Path $stage 'launcher.json')
          if ($LASTEXITCODE -ne 0) { throw 'Shared launcher diagnostic failed; original native evidence retained' }
      - name: Retain exact native namespace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-context
          path: ${{ env.MCW_CONTEXT_PROOF }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
