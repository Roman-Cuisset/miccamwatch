name: Native Unix installation

on:
  push:
    paths:
      - installer/install.sh
      - installer/install-camera-helper.sh
      - installer/com.roman-cuisset.miccamwatch.camera.policy
      - src/updater/unix.rs
      - installer/tests/native_install.py
      - .github/workflows/unix-install.yml
  pull_request:
    paths:
      - installer/install.sh
      - installer/install-camera-helper.sh
      - installer/com.roman-cuisset.miccamwatch.camera.policy
      - src/updater/unix.rs
      - installer/tests/native_install.py
      - .github/workflows/unix-install.yml
  workflow_dispatch:
    inputs:
      version:
        description: Public release to install
        default: v0.17.0
        required: true
        type: string
      upgrade-from:
        description: Older public release for cross-version proof
        default: ""
        type: string

permissions:
  contents: read

jobs:
  install:
    name: Public installer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Pull-request merge SHAs are not public raw-content refs. Verify the
      # public head commit, including the head repository for forked PRs.
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_VERSION: ${{ inputs.version || 'v0.17.0' }}
      UPGRADE_FROM: ${{ inputs.upgrade-from || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: Ensure supported shells (runner packages only)
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = Linux ]; then
            missing=""
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y pipewire pipewire-bin
            # Secure fixed system ancestry only on this disposable hosted VM;
            # do not bypass production root-helper ancestry checks.
            test "$GITHUB_ACTIONS" = true
            test "$RUNNER_ENVIRONMENT" = github-hosted
            for directory in / /usr /usr/local /usr/local/libexec /usr/share /usr/share/polkit-1 /usr/share/polkit-1/actions /var /var/lib; do
              test ! -L "$directory"
              if [ -e "$directory" ]; then
                test -d "$directory"
                stat -c '%n before installer prerequisites: uid=%u gid=%g mode=%a' "$directory"
                sudo chown root:root "$directory"
                sudo chmod go-w "$directory"
                stat -c '%n after installer prerequisites: uid=%u gid=%g mode=%a' "$directory"
              fi
            done
            for shell in bash zsh fish; do
              if ! command -v "$shell" >/dev/null 2>&1; then
                missing="$missing $shell"
              fi
            done
            if [ -n "$missing" ]; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y $missing
            fi
          else
            version=$(sw_vers -productVersion)
            test "${version%%.*}" -ge 15
            for shell in bash zsh fish; do
              if ! command -v "$shell" >/dev/null 2>&1; then
                brew install "$shell"
              fi
            done
          fi
          for shell in bash zsh fish; do
            command -v "$shell"
          done
          python3 --version
      - name: Verify public commit-pinned installer and selected release
        shell: bash
        run: |
          set -eu
          source_url="https://raw.githubusercontent.com/$SOURCE_REPOSITORY/$SOURCE_REF/installer/install.sh"
          printf 'Public source: %s\n' "$source_url"
          python3 installer/tests/native_install.py \
            --source-url "$source_url" \
            --version "$RELEASE_VERSION" \
            --upgrade-from "$UPGRADE_FROM"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: runner.os == 'macOS'
      - name: Verify public macOS standalone bootstrap and updater
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib, os, pathlib, subprocess, tempfile
          version = os.environ["RELEASE_VERSION"]
          if tuple(map(int, version.removeprefix("v").split("."))) <= (0, 16, 0):
              print("Standalone bootstrap proof requires public v0.16.1 or newer; older public releases are immutable.")
              raise SystemExit(0)
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-proof/public-standalone"
          proof.mkdir(parents=True, exist_ok=True)
          arch = "aarch64" if os.uname().machine == "arm64" else "x86_64"
          asset = f"miccamwatch-macos-{arch}.tar.gz"
          curl = ["/usr/bin/curl", "--proto", "=https", "--proto-redir", "=https", "--tlsv1.2", "-fsSL"]
          with tempfile.TemporaryDirectory(prefix="mcw-public-download-") as temporary:
              root = pathlib.Path(temporary)
              archive, sums, script = root / asset, root / "SHA256SUMS", root / "install.sh"
              release = f"https://github.com/Roman-Cuisset/miccamwatch/releases/download/{version}"
              source = f"https://raw.githubusercontent.com/{os.environ['SOURCE_REPOSITORY']}/{os.environ['SOURCE_REF']}/installer/install.sh"
              for url, path in [(f"{release}/{asset}", archive), (f"{release}/SHA256SUMS", sums), (source, script)]:
                  subprocess.run([*curl, url, "-o", str(path)], check=True)
              entries = [line.split() for line in sums.read_text().splitlines() if line.split() and line.split()[-1] == asset]
              assert len(entries) == 1 and len(entries[0]) == 2
              digest = hashlib.file_digest(archive.open("rb"), "sha256").hexdigest()
              assert digest == entries[0][0], "public archive manifest mismatch"
              subprocess.run(["python3", "-B", "installer/tests/native_mac_portable_update.py",
                              "--source-file", str(script), "--archive", str(archive), "--version", version,
                              "--public-release", "--proof", str(proof)], check=True)
          PY
      - name: Upload public standalone migration evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-standalone-${{ matrix.os }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/native-proof
