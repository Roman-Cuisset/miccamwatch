name: Native Homebrew distribution qualification

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Native cases to run; all retains the complete six-case matrix"
        type: choice
        options: [all, arm64, x86_64]
        default: all
      candidate-source-url:
        description: "Optional immutable upstream codeload URL; supply all four candidate fields"
        type: string
        default: ""
      candidate-source-sha256:
        description: "Exact SHA256 of the candidate commit archive"
        type: string
        default: ""
      candidate-ref:
        description: "Full 40-character upstream source commit SHA (not a mutable branch/tag)"
        type: string
        default: ""
      candidate-version:
        description: "Exact Cargo package version of the candidate (compatible autostart requires 0.17.1+)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: homebrew-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  homebrew-native:
    name: ${{ matrix.architecture }} / ${{ matrix.intent }} autostart
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x86_64' && '["x86_64"]' || '["arm64","x86_64"]') }}
        intent: [loaded, dormant, disabled]
    runs-on: ${{ matrix.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Qualify genuine source packages with native Homebrew toolchain
        shell: bash
        env:
          CANDIDATE_SOURCE_URL: ${{ inputs.candidate-source-url }}
          CANDIDATE_SOURCE_SHA256: ${{ inputs.candidate-source-sha256 }}
          CANDIDATE_REF: ${{ inputs.candidate-ref }}
          CANDIDATE_VERSION: ${{ inputs.candidate-version }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
          AUTOSTART_INTENT: ${{ matrix.intent }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Historical mcw also validates executable ancestors. Harden only this
          # disposable runner's user-owned Cellar; never relax the product guard.
          cellar="$(brew --cellar)"
          test -d "$cellar"
          test ! -L "$cellar"
          test "$(stat -f %u "$cellar")" = "$(id -u)"
          stat -f 'Cellar before: %N uid=%u gid=%g mode=%OLp' "$cellar"
          chmod go-w "$cellar"
          stat -f 'Cellar prepared: %N uid=%u gid=%g mode=%OLp' "$cellar"
          # Intel uses a coherent official source checkout, with API recipe
          # mixing disabled. Homebrew selects its supported toolchain normally;
          # only the application is required to build from source. Record core
          # provenance/deltas, actual Rust version and native compiler host.
          python3 -B distribution/homebrew/native_qualification.py \
            --disposable-machine \
            --architecture "$EXPECTED_ARCH" \
            --autostart-intent "$AUTOSTART_INTENT" \
            --candidate-source-url "$CANDIDATE_SOURCE_URL" \
            --candidate-source-sha256 "$CANDIDATE_SOURCE_SHA256" \
            --candidate-ref "$CANDIDATE_REF" \
            --candidate-version "$CANDIDATE_VERSION" \
            --proof "$RUNNER_TEMP/homebrew-native-proof"
      - name: Retain genuine native evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-native-${{ matrix.architecture }}-${{ matrix.intent }}
          path: ${{ runner.temp }}/homebrew-native-proof
          if-no-files-found: error
