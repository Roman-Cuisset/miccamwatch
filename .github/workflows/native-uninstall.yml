name: Native installation-scoped uninstall

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/uninstall/**'
      - 'src/uninstall.rs'
      - 'src/autostart*'
      - 'src/autostart/**'
      - 'src/updater*'
      - 'src/updater/**'
      - 'src/privacy/macos.rs'
      - 'src/platform/macos/control.rs'
      - 'installer/tests/native_uninstall.py'
      - 'installer/tests/windows_uninstall_lock.py'
      - 'installer/tests/windows_ordinary.py'
      - '.github/workflows/native-uninstall.yml'

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Initialize retained fixture evidence
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/uninstall-proof"
          platform="$RUNNER_OS"
          if [ "$platform" = macOS ]; then platform=Darwin; fi
          printf '{"platform":"%s","status":"not_started","first_failure":null}\n' "$platform" > "$RUNNER_TEMP/uninstall-proof/result.json"
          : > "$RUNNER_TEMP/uninstall-proof/private-runner.log"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install native Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libspa-0.2-dev libclang-dev pipewire-bin
          # Match native installer CI: repair hosted VM metadata, never bypass
          # the installer's fail-closed root-helper ancestry checks.
          for directory in / /usr /usr/local /usr/local/libexec /usr/share /usr/share/polkit-1 /usr/share/polkit-1/actions /var /var/lib; do
            test ! -L "$directory"
            if [ -e "$directory" ]; then
              test -d "$directory"
              stat -c '%n before uninstall prerequisites: uid=%u gid=%g mode=%a' "$directory"
              sudo chown root:root "$directory"
              sudo chmod go-w "$directory"
              stat -c '%n after uninstall prerequisites: uid=%u gid=%g mode=%a' "$directory"
            fi
          done
      - name: Build genuine native payloads
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --release --locked --features linux-camera-helper
            cargo install --locked --offline --path . --root "$RUNNER_TEMP/mcw-cargo-uninstall" --features linux-camera-helper
          else
            cargo build --release --locked
            cargo install --locked --offline --path . --root "$RUNNER_TEMP/mcw-cargo-uninstall"
          fi
      - name: Exercise actual removal and byte-preserving refusals
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          umask 077
          proof="$RUNNER_TEMP/uninstall-proof"
          status=0
          python3 -B installer/tests/native_uninstall.py --binary "$GITHUB_WORKSPACE/target/release/mcw" --repository "$GITHUB_WORKSPACE" --cargo-install "$RUNNER_TEMP/mcw-cargo-uninstall" --proof "$proof/result.json" > "$proof/private-runner.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            # Preserve Python's precise first failure; cover failures before
            # main() could replace the bootstrap report without printing logs.
            python3 - "$proof/result.json" <<'PY' >> "$proof/private-runner.log" 2>&1
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          report = json.loads(path.read_text())
          if report.get("status") == "not_started":
              report.update(status="failed", first_failure={"type": "FixtureLaunchFailure", "details_file": "private-runner.log"})
              path.write_text(json.dumps(report, indent=2) + "\n")
          PY
            printf '%s\n' 'Native uninstall fixture failed; see retained private evidence artifact.' >&2
            exit "$status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: uninstall-${{ matrix.os }}
          path: ${{ runner.temp }}/uninstall-proof
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo build --release --locked --features windows-tray
      - name: Build genuine per-user MSI
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'WiX tool restore failed' }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          dotnet wix build installer/miccamwatch.wxs -d Version=$version -d Executable=target/release/mcw.exe -d TrayExecutable=target/release/mcw-tray.exe -o target/mcw-uninstall-fixture.msi
          if ($LASTEXITCODE -ne 0) { throw 'Native MSI fixture build failed' }
      - name: Exercise real ordinary-token worker and protection ownership
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          foreach ($name in @('AudioEndpointBuilder', 'Audiosrv')) {
            $service = Get-Service $name -ErrorAction Stop
            if ($service.Status -ne 'Running') {
              Set-Service $name -StartupType Manual
              Start-Service $name -ErrorAction Stop
            }
          }
          # Public Documents supplies normal inherited standard-user access.
          # Do not grant/replace ACLs on the runner profile or product payloads.
          $staging = Join-Path $env:PUBLIC ('Documents/MicCamWatchQualification/uninstall-' + [guid]::NewGuid().ToString('N'))
          $proof = Join-Path $staging 'proof'
          New-Item -ItemType Directory $proof -Force | Out-Null
          "MCW_UNINSTALL_PROOF=$proof" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $python = (Get-Command python).Source
          $repository = Join-Path $staging 'repository'
          $archive = Join-Path $staging 'source.zip'
          git archive --format=zip "--output=$archive" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tracked qualification source staging failed' }
          Expand-Archive -LiteralPath $archive -DestinationPath $repository
          $release = Join-Path $repository 'target/release'
          New-Item -ItemType Directory $release -Force | Out-Null
          foreach ($name in @('mcw.exe', 'mcw-tray.exe')) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "target/release/$name") -Destination $release
          }
          $binary = Join-Path $release 'mcw.exe'
          $fixture = Join-Path $repository 'installer/tests/native_uninstall.py'
          $cargo = Join-Path $staging 'mcw-cargo-uninstall'
          $msi = Join-Path $repository 'target/mcw-uninstall-fixture.msi'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target/mcw-uninstall-fixture.msi') -Destination $msi
          # A genuine Cargo install runs AS the ordinary account. Copy only
          # public toolchain/registry inputs, never runner credentials or ACLs.
          $toolchain = (rustc --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Actual Rust toolchain lookup failed' }
          $rust = Join-Path $staging 'rust-toolchain'
          Copy-Item -LiteralPath $toolchain -Destination $rust -Recurse
          $cargoHome = Join-Path $staging 'cargo-home'
          New-Item -ItemType Directory $cargoHome -Force | Out-Null
          $registryHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          Copy-Item -LiteralPath (Join-Path $registryHome 'registry') -Destination (Join-Path $cargoHome 'registry') -Recurse
          $ordinaryPath = (Join-Path $rust 'bin') + ';' + $env:PATH
          $result = Join-Path $proof 'result.json'
          $log = Join-Path $proof 'private-runner.log'
          [IO.File]::WriteAllText($log, "Ordinary-token qualification has not started.`n")
          [IO.File]::WriteAllText($result, '{"platform":"Windows","status":"not_started"}')
          $wrapper = Join-Path $proof 'ordinary-token.ps1'
          $body = @"
          `$ErrorActionPreference = 'Stop'
          `$env:GITHUB_ACTIONS = 'true'
          `$env:RUNNER_ENVIRONMENT = 'github-hosted'
          `$env:PATH = '$($ordinaryPath.Replace("'", "''"))'
          `$env:CARGO_HOME = '$($cargoHome.Replace("'", "''"))'
          `$env:GITHUB_WORKSPACE = '$($repository.Replace("'", "''"))'
          `$exitCode = 1
          try {
            # Windows PowerShell 5 must not turn the native stderr stream into
            # a terminating NativeCommandError that truncates the traceback.
            `$ErrorActionPreference = 'Continue'
            & cargo install --locked --offline --path '$($repository.Replace("'", "''"))' --root '$($cargo.Replace("'", "''"))' --features windows-tray *> '$(Join-Path $proof 'private-cargo-install.log')'
            `$cargoExit = `$LASTEXITCODE
            `$ErrorActionPreference = 'Stop'
            if (`$cargoExit -ne 0) { throw 'Genuine ordinary-account Cargo installation failed; inspect private-cargo-install.log' }
            `$ErrorActionPreference = 'Continue'
            & '$($python.Replace("'", "''"))' -u -B '$($fixture.Replace("'", "''"))' --binary '$($binary.Replace("'", "''"))' --repository '$($repository.Replace("'", "''"))' --cargo-install '$($cargo.Replace("'", "''"))' --msi '$($msi.Replace("'", "''"))' --proof '$($result.Replace("'", "''"))' *> '$($log.Replace("'", "''"))'
            `$exitCode = `$LASTEXITCODE
            `$ErrorActionPreference = 'Stop'
          } catch {
            (`$_ | Out-String) | Add-Content -LiteralPath '$($log.Replace("'", "''"))'
            `$_.ScriptStackTrace | Add-Content -LiteralPath '$($log.Replace("'", "''"))'
          }
          exit `$exitCode
          "@
          [IO.File]::WriteAllText($wrapper, $body)
          # The launcher verifies a genuine ordinary account/profile and Explorer
          # in a scheduler-owned session. Only the fresh identity receives its
          # required batch-logon right; no existing account, UAC or ACL is changed.
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'installer/tests/windows_ordinary.py'
          $launcherReport = Join-Path $proof 'private-launcher.json'
          $launcherLog = Join-Path $proof 'private-launcher-runner.log'
          try {
            & $python -u -B $launcher --script $wrapper --working-directory $repository --timeout 1500 --report $launcherReport *> $launcherLog
            if ($LASTEXITCODE -ne 0) { throw 'Ordinary-token launcher or native fixture did not complete successfully; private evidence will be uploaded' }
            if (-not (Test-Path $result)) { throw 'Native proof report missing' }
            $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
            if ($report.status -ne 'passed') { throw 'Native fixture exited without completed proof' }
          } catch {
            ($_ | Out-String) | Add-Content -LiteralPath $log
            $_.ScriptStackTrace | Add-Content -LiteralPath $log
            $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
            if ($report.status -eq 'not_started') {
              $details = if (Test-Path $launcherReport) { 'private-launcher.json' } else { 'private-runner.log' }
              $failure = @{ platform = 'Windows'; status = 'failed'; first_failure = @{ type = 'OrdinaryTokenFixtureError'; details_file = $details } }
              [IO.File]::WriteAllText($result, ($failure | ConvertTo-Json -Depth 4))
            }
            throw 'Native Windows qualification failed; inspect the uploaded private evidence'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: uninstall-windows
          path: ${{ env.MCW_UNINSTALL_PROOF }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
