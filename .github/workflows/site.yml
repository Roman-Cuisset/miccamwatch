name: Static website

on:
  push:
    branches: [main]
    paths: ['site/**', 'installer/install.sh', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'installer/install.sh', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Exercise translation boundaries
        run: node --test site/localization.test.mjs
      - name: Export all languages and verified installer
        run: node site/build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miccamwatch-pages
          path: site-dist
          if-no-files-found: error
